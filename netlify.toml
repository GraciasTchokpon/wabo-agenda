# Netlify publie le dossier site/ tel quel (aucune compilation).
# Pour ajouter des événements : modifier data/events.json puis lancer
#   python3 scripts/build_site.py
[build]
  base = ""
  publish = "site"
  # Site statique déjà construit : on prévient seulement Bing des pages (IndexNow).
  command = "python3 scripts/indexnow.py || true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
